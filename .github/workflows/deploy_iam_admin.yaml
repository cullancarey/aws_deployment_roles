name: Deploy-CDK-DeploymentRoleStack/Admin

on:
  push:
    branches:
      - main

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

env:
  CDK_DEFAULT_REGION: us-east-2
  GITHUBDEPLOYROLE: ${{ vars.GITHUBDEPLOYROLE }}
  ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
  ENVIRONMENT: "management"
  CDK_DEPLOY_ACCOUNT: ${{ vars.ACCOUNT_ID }}
  CDK_DEPLOY_REGION: ${{ vars.REGION }}

jobs:
  deploy-to-mmi-admin-environment:
    name: Deploy to management
    environment: management
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock
      # Configure AWS Creds management
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/${{ env.GITHUBDEPLOYROLE }}
          role-session-name: GithubActionsRoleManagement-${{ github.run_id }}
          aws-region: ${{ vars.REGION }}

      - name: Install CDK
        working-directory: cdk
        run: npm ci

      - name: Sync Python dependencies
        working-directory: cdk
        run: uv sync --frozen

      - name: CDK Synth
        working-directory: cdk
        run: npx cdk synth --app "uv run python app.py"

      - name: Deploy CDK Stacks
        working-directory: cdk
        run: >
          npx cdk deploy --app 'cdk.out/' --require-approval never
          OrganizationAuditResourcesStack
          OrganizationPolicyGuardrailsStack
          DeploymentRolesStackSet